# Nome applicazione
spring.application.name=personalPortfolio

#==================================
# = Datasource PostgreSQL (configure via environment variables in production)
# - Use SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# - Example: export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/personalPortfolio
#==================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/personalPortfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Log dettagliato SQL (opzionale, utile per debugging)
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace

#==================================
# = Web server
#==================================
server.port=8080

# Plausible analytics (disabled by default)
plausible.enabled=false
plausible.domain=

# Optional Sentry DSN (set SENTRY_DSN env var in production to enable error reporting)
sentry.dsn=

#==================================
# = Thymeleaf configurations
#==================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

#==================================
# = Messages configurations
#==================================
spring.messages.basename=static/messages/messages
spring.messages.encoding=ISO-8859-1
