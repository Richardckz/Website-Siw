<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Messages List</title>
    <link rel="stylesheet" th:href="@{/libraries/bootstrap.min.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Nobile:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="admin-bg">

<div class="admin-container">

    <h1 style="color:#fff;text-align:center;">Messages List</h1>
    <a th:href="@{/admin/dashboard}" class="btn back" style="margin-bottom:10px; display:inline-block;">← Dashboard</a>

    <table class="admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Sender Name</th>
                <th>Email</th>
                <th>Message Preview</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="msg : ${messages}">
            <td th:text="${msg.id}"></td>
            <td th:text="${msg.nome}"></td>
            <td th:text="${msg.email}"></td>
            <td th:text="${msg.message.length() > 40 ? msg.message.substring(0,40) + '...' : msg.message}"></td>
            <td th:text="${msg.dataInvio}"></td>
            <td>
                <span th:class="'badge ' + (${msg.read} ? 'read' : 'unread')"
                      th:text="${msg.read} ? 'Read' : 'Unread'"></span>
            </td>
            <td>
                <a th:href="@{/admin/messages/{id}(id=${msg.id})}" class="btn view">View</a>
                <a th:href="@{/admin/messages/delete/{id}(id=${msg.id})}" class="btn delete"
                   onclick="return confirm('Are you sure you want to delete this message?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(messages)}">
            <td colspan="7" style="text-align:center;color:#fff;">No messages found.</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
