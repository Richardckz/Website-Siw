<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - View Message</title>
    <link rel="stylesheet" th:href="@{/libraries/bootstrap.min.css}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Nobile:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="admin-bg">

<div class="admin-container">

    <h1 style="color:#fff;text-align:center;">Message Details</h1>

    <div class="message-card">

        <p class="field-title">ID:</p>
        <p th:text="${message.id}"></p>

        <p class="field-title">Sender Name:</p>
        <p th:text="${message.nome}"></p>

        <p class="field-title">Email:</p>
        <p th:text="${message.email}"></p>

        <p class="field-title">Sent on:</p>
        <p th:text="${message.dataInvio}"></p>

        <p class="field-title">Status:</p>
        <span th:class="'badge ' + (${message.read} ? 'read' : 'unread-status')"
              th:text="${message.read} ? 'Read' : 'Unread'"></span>

        <p class="field-title">Message:</p>
        <p th:text="${message.message}" style="white-space: pre-wrap;"></p>

        <div class="message-actions">
            <a th:href="@{/admin/dashboard}" class="btn back">← Dashboard</a>
            <a th:href="@{/admin/messages}" class="btn back">Back to List</a>
            <a th:if="${message.read}" th:href="@{/admin/messages/unread/{id}(id=${message.id})}" class="btn unread-btn">
                Mark as Unread
            </a>
            <a th:href="@{/admin/messages/delete/{id}(id=${message.id})}" class="btn delete"
               onclick="return confirm('Are you sure you want to delete this message?');">Delete Message</a>
        </div>

    </div>

</div>

</body>
</html>
