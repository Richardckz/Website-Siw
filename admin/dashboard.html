<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/libraries/bootstrap.min.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nobile:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Your main CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="admin-dashboard-page">

<!-- Navbar -->
<nav class="navbar px-4 py-3">
    <span class="navbar-brand fw-bold">
        Admin
    </span>

    <a th:href="@{/logout}" class="btn btn-outline-dark btn-sm">
        Logout
    </a>
</nav>

<!-- Dashboard -->
<div class="admin-dashboard-wrapper">
    <div class="admin-dashboard-cards">

        <a th:href="@{/admin/experience}" class="admin-card">
            <i class="fas fa-briefcase"></i>
            <h3>Experiences</h3>
        </a>

        <a th:href="@{/admin/messages}" class="admin-card">
            <i class="fas fa-envelope"></i>
            <h3>Messages</h3>
        </a>

    </div>
</div>

<script th:src="@{/libraries/bootstrap.min.js}"></script>
</body>
</html>
