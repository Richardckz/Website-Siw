<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaggio ricevuto</title>
    <!-- Font Awesome per l'icona -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="contact-page">
    <div class="message-container">
        <i class="fa-solid fa-circle-check success-icon"></i>
        <h1>Grazie per avermi contattato!</h1>
        <p th:text="'Ciao ' + ${nome} + ', il tuo messaggio è stato inviato con successo. Ti risponderò al più presto!'">
            Il tuo messaggio è stato inviato con successo.
        </p>
        <a href="/" class="btn-back-home">Torna alla Home</a>
    </div>
</body>

</html>
