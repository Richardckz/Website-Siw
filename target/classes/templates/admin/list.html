<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Experience List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="admin-bg">

<div class="admin-container">
    <h1>Experience List</h1>

<a th:href="@{/admin/experience/new}" class="new-experience">+ Add New Experience</a>

<table class="admin-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Role</th>
            <th>Company</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="exp : ${experiences}">
            <td th:text="${exp.id}"></td>
            <td th:text="${exp.role}"></td>
            <td th:text="${exp.company}"></td>
            <td th:text="${exp.startDate}"></td>
            <td th:text="${exp.endDate != null ? exp.endDate : 'Present'}"></td>
            <td th:text="${exp.description}"></td>
            <td>
                <div class="experience-actions">
                    <a th:href="@{/admin/experience/edit/{id}(id=${exp.id})}" class="btn edit">Edit</a>
                    <a th:href="@{/admin/experience/delete/{id}(id=${exp.id})}" class="btn delete"
                       onclick="return confirm('Are you sure you want to delete this experience?');">Delete</a>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(experiences)}">
            <td colspan="7" style="text-align:center;">No experiences found.</td>
        </tr>
    </tbody>
</table>
</div>

</body>
</html>
