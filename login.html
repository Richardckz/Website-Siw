<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-bg">

<div class="login-container">
    <div class="login-box">
        <h2 class="text-center mb-4">Admin Login</h2>

        <form th:action="@{/login}" method="post" aria-label="Admin login form">
            <input type="hidden" name="redirect" th:value="${redirect}" />
            <div class="mb-3">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control" name="username" required aria-required="true">
            </div>

            <div class="mb-3">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" name="password" required aria-required="true">
            </div>

            <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>
    </div>
</div>

</body>
</html>
